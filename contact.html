<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="site-logo dummy-link">Site name</a>

            <nav class="nav-menu">
                <a href="#" class="nav-link dummy-link">Page</a>
                <a href="#" class="nav-link dummy-link">Page</a>
                <a href="#" class="nav-link dummy-link">Page</a>
                <a href="contact.html" class="btn-black">Button</a>
            </nav>

            <button class="burger-btn" aria-label="Відкрити меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div class="mobile-menu">
        <div class="mobile-menu-links">
            <a href="#" class="mobile-nav-link dummy-link">Page</a>
            <a href="#" class="mobile-nav-link dummy-link">Page</a>
            <a href="#" class="mobile-nav-link dummy-link">Page</a>
        </div>
        <a href="contact.html" class="btn-black mobile-menu-btn">Send form</a>
    </div>

    <section class="contact-section">
        <div class="container contact-layout">
            <div class="contact-form-block">
                <h1 class="section-title">Contact us</h1>
                <p class="section-subtitle">Subheading for description or instructions</p>

                <form class="contact-form" onsubmit="event.preventDefault();">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first-name">First name</label>
                            <input type="text" id="first-name" class="form-input" placeholder="Jane">
                        </div>
                        <div class="form-group">
                            <label for="last-name">Last name</label>
                            <input type="text" id="last-name" class="form-input" placeholder="Smitherton">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" class="form-input" placeholder="email@janesfakedomain.net">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input type="tel" id="phone" class="form-input" placeholder="Enter your phone number +380...">
                    </div>

                    <div class="form-group">
                        <label for="message">Your message</label>
                        <textarea id="message" class="form-textarea"
                            placeholder="Enter your question or message"></textarea>
                    </div>

                    <button type="submit" class="btn-black" style="width: 100%; padding: 14px;">Submit</button>
                </form>
            </div>

            <div class="contact-image-wrap">
                <img src="img/contact_pic.png" alt="Contact person">
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <a href="index.html" class="site-logo dummy-link" style="padding-left: 0;">Site name</a>
                <div class="social-icons">
                    <a href="#" class="social-link dummy-link">🌐</a>
                    <a href="#" class="social-link dummy-link">📷</a>
                    <a href="#" class="social-link dummy-link">🐦</a>
                    <a href="#" class="social-link dummy-link">▶</a>
                </div>
            </div>

            <div class="footer-columns">
                <div class="footer-col">
                    <h4 class="footer-col-title">Topic</h4>
                    <ul class="footer-links">
                        <li><a href="#" class="dummy-link">Page</a></li>
                        <li><a href="#" class="dummy-link">Page</a></li>
                        <li><a href="#" class="dummy-link">Page</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4 class="footer-col-title">Topic</h4>
                    <ul class="footer-links">
                        <li><a href="#" class="dummy-link">Page</a></li>
                        <li><a href="#" class="dummy-link">Page</a></li>
                        <li><a href="#" class="dummy-link">Page</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4 class="footer-col-title">Topic</h4>
                    <ul class="footer-links">
                        <li><a href="#" class="dummy-link">Page</a></li>
                        <li><a href="#" class="dummy-link">Page</a></li>
                        <li><a href="#" class="dummy-link">Page</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
